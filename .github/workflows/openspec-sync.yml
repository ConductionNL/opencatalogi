name: OpenSpec Sync

on:
  push:
    branches: [development]
    paths: ['openspec/**']
  workflow_dispatch:

# The callee needs `issues: write`; a caller capped at `contents: read` makes
# the call unsatisfiable.

jobs:
  sync:
    uses: ConductionNL/.github/.github/workflows/openspec-sync.yml@main
    with:
      app-name: opencatalogi
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
