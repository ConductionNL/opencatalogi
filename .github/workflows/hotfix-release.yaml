name: WOO-572 Hotfix Release

# WOO-572 — custom hotfix release for the WOO stable line (OpenCatalogi 1.0.9
# + Full Text Search from WOO-536), deployed manually on acato.
#
# Runs on pushes to the hotfix branch only, NOT on main. Produces a GitHub
# PRERELEASE (`prerelease: true`) so Nextcloud never offers it as "latest";
# installation happens via the kubectl route (disable -> replace directory ->
# enable), see plans/issues/WOO-572/.
#
# Naming: <base_tag>-<project>-<version> (Barry Brands, WOO-552):
#   v1.0.9 + WOO hotfix 1  ->  version 1.0.9-woo-1, tag v1.0.9-woo-1.
# Every push to this branch rebuilds and OVERWRITES the same tag/release
# (allowUpdates + overwrite). Bump `<version>` in appinfo/info.xml by hand to
# 1.0.9-woo-2 only for a runtime change after 1.0.9-woo-1 has been deployed;
# tests-only pushes keep the version.
#
# Basis: ConductionNL/integriq @ hotfix/woo-552-content-disposition-rfc6266
#        .github/workflows/hotfix-release.yaml (WOO-552), rsync excludes
#        aligned with ConductionNL/.github release.yml (the shared stable
#        release workflow this repo normally uses).
on:
  push:
    branches:
      - hotfix/woo-572-fts-stable-line

jobs:
  release-management:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The build's version IS the version in appinfo/info.xml on this
      # branch (1.0.9-woo-N). No run number is appended.
      - name: Set app env
        run: |
          echo "APP_NAME=opencatalogi" >> $GITHUB_ENV
          new_version=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml)
          echo "NEW_VERSION=${new_version}" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${new_version}" >> $GITHUB_ENV
          echo "Building ${new_version} (tag v${new_version}) from ${GITHUB_SHA}"

      # NEXTCLOUD_SIGNING_KEY / NEXTCLOUD_SIGNING_CERT are repository secrets
      # on ConductionNL/opencatalogi (same ones the shared release.yml uses).
      - name: Prepare Signing Certificate and Key
        run: |
          echo "${{ secrets.NEXTCLOUD_SIGNING_CERT }}" > signing-cert.crt
          echo "${{ secrets.NEXTCLOUD_SIGNING_KEY }}" > signing-key.key
          grep -q "CERTIFICATE" signing-cert.crt || { echo "signing cert secret empty"; exit 1; }
          grep -q "PRIVATE KEY" signing-key.key || { echo "signing key secret empty"; exit 1; }

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Set up PHP and install extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, gd

      - run: npm ci
      - run: npm run build
      - run: composer install --no-dev --optimize-autoloader --classmap-authoritative

      - name: Copy the package files into the package
        run: |
          mkdir -p package/${{ env.APP_NAME }}
          rsync -a \
            --exclude='/package' \
            --exclude='/.git' \
            --exclude='/.github' \
            --exclude='/.claude' \
            --exclude='/.hydra' \
            --exclude='/.cursor' \
            --exclude='/.vscode' \
            --exclude='/.nextcloud' \
            --exclude='/docker' \
            --exclude='/docker-compose.yml' \
            --exclude='/docs' \
            --exclude='/docusaurus' \
            --exclude='/website' \
            --exclude='/node_modules' \
            --exclude='/src' \
            --exclude='/phpcs-custom-sniffs' \
            --exclude='/resources' \
            --exclude='/tests' \
            --exclude='/data' \
            --exclude='/openspec' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/composer.json' \
            --exclude='/composer.lock' \
            --exclude='/composer-setup.php' \
            --exclude='/phpcs.xml' \
            --exclude='/phpmd.xml' \
            --exclude='/psalm.xml' \
            --exclude='/phpunit.xml' \
            --exclude='/phpunit-unit.xml' \
            --exclude='/.phpunit.cache' \
            --exclude='.phpunit.result.cache' \
            --exclude='/jest.config.js' \
            --exclude='/eslint.config.js' \
            --exclude='/webpack.config.js' \
            --exclude='/tsconfig.json' \
            --exclude='/.babelrc' \
            --exclude='/.eslintrc.js' \
            --exclude='/.prettierrc' \
            --exclude='/stylelint.config.js' \
            --exclude='/.spectral.yml' \
            --exclude='/.gitignore' \
            --exclude='/.gitattributes' \
            --exclude='/.php-cs-fixer.dist.php' \
            --exclude='/.nvmrc' \
            --exclude='/changelog-ci-config.json' \
            --exclude='/coverage.txt' \
            --exclude='/.coverage-baseline' \
            --exclude='/signing-key.key' \
            --exclude='/signing-cert.crt' \
            --exclude='/openapi.json' \
            --exclude='/.phpqa.yml' \
            --exclude='/.grype.yaml' \
            --exclude='/sbom.cdx.json' \
            --exclude='/bom-npm-test.cdx.json' \
            --exclude='/*_ANALYSIS.md' \
            --exclude='/*_FIX.md' \
            --exclude='/*_SUMMARY.md' \
            --exclude='/*_GUIDE.md' \
            --exclude='/CHANGELOG.md' \
            --exclude='/CONTRIBUTING.md' \
            ./ package/${{ env.APP_NAME }}/

      - name: Verify package
        run: |
          test -d package/${{ env.APP_NAME }}/vendor || { echo "vendor missing"; exit 1; }
          test -d package/${{ env.APP_NAME }}/js || { echo "js build missing"; exit 1; }
          grep -q "<id>${{ env.APP_NAME }}</id>" package/${{ env.APP_NAME }}/appinfo/info.xml
          grep "<version>" package/${{ env.APP_NAME }}/appinfo/info.xml
          grep -q "WOO572RepairReadRules" package/${{ env.APP_NAME }}/appinfo/info.xml
          test -f package/${{ env.APP_NAME }}/lib/Repair/WOO572RepairReadRules.php

      - name: Create Tarball
        run: |
          cd package && tar -czf ../nextcloud-release.tar.gz ${{ env.APP_NAME }}

      - name: Sign the TAR.GZ file with OpenSSL
        run: |
          openssl dgst -sha512 -sign signing-key.key nextcloud-release.tar.gz | openssl base64 -out nextcloud-release.signature

      # `prerelease: true` keeps Nextcloud from picking this up as "latest".
      # `commit: github.sha` pins the tag to the built commit; without it
      # GitHub creates the tag on the DEFAULT branch (main) — WOO-552 lesson.
      - name: Create / update the WOO-572 hotfix prerelease
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          commit: ${{ github.sha }}
          name: WOO-572 Hotfix Release ${{ env.NEW_VERSION }} (WOO stable line)
          body: |
            Custom hotfix prerelease for the WOO stable line — OpenCatalogi 1.0.9 + Full Text Search per WOO-536 (catalog-model scope, SQL RBAC visibility).
            Built from `${{ github.sha }}` on `${{ github.ref_name }}`. Install manually (kubectl route); not offered by the Nextcloud app store.
            Jira: https://conduction.atlassian.net/browse/WOO-572
          draft: false
          prerelease: true
          allowUpdates: true
          removeArtifacts: true

      - name: Attach tarball to GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: nextcloud-release.tar.gz
          asset_name: ${{ env.APP_NAME }}-${{ env.RELEASE_TAG }}.tar.gz
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true

      - name: Attach signature to GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: nextcloud-release.signature
          asset_name: ${{ env.APP_NAME }}-${{ env.RELEASE_TAG }}.signature
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true

      - name: Verify version and contents
        run: |
          echo "App version: ${{ env.NEW_VERSION }}"
          tar -tzf nextcloud-release.tar.gz | head -20
          tar -xOf nextcloud-release.tar.gz ${{ env.APP_NAME }}/appinfo/info.xml | grep -E "<id>|<version>"
