name: Issue Triage

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      backlog-existing:
        description: "Triage all existing untriaged open issues"
        type: boolean
        default: true

# The callee needs `issues: write`; a caller capped at `contents: read` makes
# the call unsatisfiable.

jobs:
  triage:
    uses: ConductionNL/.github/.github/workflows/issue-triage.yml@main
    with:
      app-name: opencatalogi
      backlog-existing: ${{ github.event_name == 'workflow_dispatch' && inputs.backlog-existing || false }}
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
