# gitleaks configuration: the default rules, plus allowlists for findings
# that are not secrets. Each allowlist names the exact files and only the
# rules that fire there, so anything else in those files is still reported.

[extend]
useDefault = true

[[allowlists]]
description = "Demo provisioning script: curl calls with the default admin:admin login of the local demo container."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)docker/demo/provision\.sh$''',
]

[[allowlists]]
description = "Demo seed data: the key fields are human-readable slugs (woo-..., bewaar-...), not credentials."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)lib/Settings/example\-sets/zuiddrecht\.json$''',
]

[[allowlists]]
description = "Pipeline record: credential_name is the UUID that names a stored credential, not the credential itself."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)openspec/changes/opencatalogi\-delegate\-broadcast\-to\-or\-webhooks/hydra\.json$''',
]

[[allowlists]]
description = "Unit test fixture: a deliberately planted fake token (ghp_PLANTED_SECRET_...) that the test asserts never reaches logs or responses."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)tests/Unit/Service/PubliccodeHarvestServiceTest\.php$''',
]

[[allowlists]]
description = "Postman collection: the key field is a variable name (nc2...Id) with an empty value."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)tests/federation/federation\-tests\.postman_collection\.json$''',
]
