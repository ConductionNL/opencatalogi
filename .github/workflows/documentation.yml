name: Documentation

on:
  push:
    branches: [documentation]
  pull_request:
    branches: [documentation]

# The callee's deploy job needs `contents: write` (gh-pages) and its fallback
# image job needs `packages: write`; a caller capped at `contents: read`
# makes the call unsatisfiable.

jobs:
  deploy:
    uses: ConductionNL/.github/.github/workflows/documentation.yml@main
    with:
      cname: opencatalogi.conduction.nl
