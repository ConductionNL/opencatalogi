name: Code Quality

on:
  push:
    branches: [main, beta, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    # `synchronize` — a push to an open PR — was missing. Without it the quality
    # suite runs ONCE, when the PR is opened, and every commit after that is
    # merged unchecked while the PR still shows the first run's green tick. A
    # green check here described code that no longer existed.
    #
    # The branch list on `push:` does not cover the gap: it names `feature/**`
    # while the convention in practice is also `feat/**` and `fix/**`.
    #
    # Cost is bounded by the `concurrency` block below — a new push cancels the
    # in-flight run for the same head ref rather than queueing beside it.
    #
    # openregister fixed the identical defect on its own copy of this workflow;
    # this matches that.
    types: [opened, reopened, synchronize]
    branches: [main, beta, development]
  workflow_dispatch:

# Deduplicating a `push` run against the `pull_request` run for the SAME head
# ref is the point of this block, and for a feature branch it is exactly right:
# two runs of identical jobs, one of them wasted.
#
# It is wrong for `main` and `development`, because the push run there is NOT a
# duplicate — it is the only carrier of the push-only jobs: "Coverage Baseline
# Check" (`github.event_name == 'push'`), "SBOM" and "Features Extract". And
# those two branches always have an open PR whose `head_ref` IS the branch
# name: the standing "Release: merge development into beta" (#538 here).
# `github.head_ref` on that PR run and `github.ref_name` on the push run both
# render `development`, so both landed in the identical group
# `quality-development`, and `cancel-in-progress` killed whichever started
# first — always the push run, by a few seconds.
#
# Measured on this repo: 12 of the last 20 `development` push runs were
# cancelled within ~60s of starting — e.g. 30894403295 (39s), 30892283570
# (49s), 30891401858 (37s), 30889373825 (56s), 30856896959 (38s). That
# duration is the discriminator: the shared workflow's `timeout-minutes: 45`
# cancellation lands at 45m16s–45m28s, so these are concurrency kills.
#
# On the surviving PR run "Coverage Baseline Check" reports `skipped`, which is
# CORRECT for a pull_request event and renders exactly like a pass. So the gate
# appears on both runs and executes on neither — a dead gate of the
# permanently-pending shape.
#
# Suffixing only the default-branch push keeps feature-branch dedup untouched
# (`quality-feature/x` for both events, exactly as before) and gives the two
# default branches' push runs a lane of their own.
#
# Proven in openconnector#1158: its first-ever completed `development` push run
# (31048998594) executed Coverage Baseline Check, SBOM and Features Extract.
concurrency:
  group: quality-${{ github.head_ref || github.ref_name }}${{ (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'development')) && '-push' || '' }}
  cancel-in-progress: true

# Permission CEILING for the called quality pipeline. GitHub statically
# validates the called workflow's declared job permissions against this
# grant — even for jobs that are disabled — so capping any of these at
# `read` makes the whole call fail to START (zero jobs, no annotations,
# indistinguishable from "nothing to run"). Union of what the nested jobs
# need: journeydoc-capture (contents+actions write), update-baseline /
# features-extract (contents write), the Quality Report PR comment
# (issues / pull-requests write), and packages: read for pulling org images.
permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
  packages: read

jobs:
  quality:
    if: github.event_name != 'push' || github.event.created != true
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: opencatalogi
      php-version: "8.3"
      php-test-versions: '["8.3", "8.4"]'
      nextcloud-test-refs: '["stable32"]'
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      # PHPUnit re-enabled after the unit-suite revival. The original CI hang was
      # caused by the DirectoryService::syncDirectory / BroadcastService::broadcast
      # tests driving the SSRF outbound-URL guard, which does real DNS resolution
      # (dns_get_record / gethostbyname) and stalls on runners without outbound DNS.
      # Those tests are now tagged @group network and excluded by default in both
      # phpunit.xml and phpunit-unit.xml, so the suite is deterministic and offline-safe.
      enable-phpunit: true
      additional-apps: '[{"repo":"ConductionNL/openregister","app":"openregister","ref":"development"}]'

      # ── E2E browser tests ────────────────────────────────────────────────
      # `playwright-test-path` does double duty in the shared workflow:
      #   1. it is the directory the "Validate Playwright tests exist" step
      #      counts *.spec.ts in;
      #   2. it is the FIRST place the run step looks for a config —
      #      `${playwright-test-path}/playwright.config.ts`, falling back to
      #      the repo root only if that file is absent.
      # We ship tests/e2e/playwright.config.ts precisely so lookup (2) hits it.
      # The run step passes no `--project`, so the root config would run all
      # three of its projects — including `visual` (pixel baselines that a CI
      # Linux runner cannot byte-match) and `docs-capture` (screenshot
      # re-shoots, which have their own dedicated job). The tests/e2e config
      # declares only the regression project.
      enable-playwright: true
      playwright-test-path: tests/e2e
      # `occ app:enable opencatalogi` runs InitializeSettings, but that repair
      # step has no user session (OpenRegister RBAC can deny it), swallows its
      # own exception as a warning, and imports with `force: false` — so a
      # fresh install can come up with no publication register at all and
      # nothing exits non-zero. The script imports explicitly over the admin
      # API and fails loudly if the register/schemas still aren't there.
      # cwd for this step is the Nextcloud server root.
      playwright-seed-command: 'bash apps/opencatalogi/tests/e2e/ci-seed.sh'

      # ── Integration tests ────────────────────────────────────────────────
      # Was explicitly `false`. tests/integration ships six
      # *.postman_collection.json files (dcat-ap-harvest,
      # dcat-national-portal-federation, diwoo-tooi-vocabulary-binding,
      # ooapi-catalog-publication, publication-quality-metrics,
      # structured-data-discoverability) that had never executed in CI. They sit
      # at the default `newman-collection-path` (tests/integration), which is
      # both the directory the validator counts collections in and the directory
      # the run step globs flat.
      enable-newman: true

      # ── Frontend Check legs ──────────────────────────────────────────────
      # `frontend-checks` defaults to `[]`, and an empty list means the shared
      # workflow emits NO "Frontend Check" job at all — so these two validators
      # ran nowhere while the run still looked complete. Both are self-contained
      # `node` scripts, which is what a leg has to be.
      # Measured on this tree before enabling: BOTH FAIL — `check:l10n` reports
      # 75 issues, `check:manifest` reports `pages[19].type: "roadmap" not in
      # v1.2 enum` (the same defect reproduces in 10 other fleet repos). Real
      # pre-existing defects; the gate is what makes them visible.
      # `test` / `test:unit` are NOT listed: "Frontend Tests (unit)" runs them.
      frontend-checks: '["check:l10n", "check:manifest"]'

      # ── Coverage ratchet ─────────────────────────────────────────────────
      # `enable-coverage-guard` defaults to FALSE, which is why both
      # "Coverage Baseline Protection" and "Coverage Baseline Check" have only
      # ever reported `skipped`. It needs two inputs this repo did not have,
      # both added in this commit: `scripts/coverage-guard.php` (byte-identical
      # to openregister's) and `.coverage-baseline` = 70.69, this repo's own
      # measured coverage (7780 of 11006 statements) read from clover.xml in the
      # `coverage-report` artifact of run 30911317929.
      enable-coverage-guard: true

      # ── Hydra mechanical gates ───────────────────────────────────────────
      # `enable-hydra-gates` defaults to FALSE, so this tier has never executed
      # here — the job reported `skipped`, which the Quality Report renders
      # identically to a pass. Pinned to v1.0.1 so a change to the gate package
      # cannot move this repo's verdict without a commit here.
      # `enable-axe` deliberately NOT set: a vanilla Nextcloud 34 already carries
      # serious/critical violations from core's own UI.
      #
      # v1.0.1 -> v1.3.0 (ConductionNL/.github#159). Two defects, one bump.
      #
      # 1. STALE. v1.0.1 is `f4d9756` (2026-08-03) and predates three gate
      #    fixes, so every Hydra Gates run this repo has ever made executed a
      #    script in which 16 gates reported PASS when their helper never ran
      #    (#147), gate-33 had no axe report to read and never said so (#148),
      #    and gates 6 and 7 reported PASS on an EMPTY scope (#149). A gate
      #    that reports PASS without running emits a tick identical to a real
      #    one, which is why nothing in this repo's history shows it.
      #
      # 2. RED. quality.yml is referenced `@main` while this package is
      #    PINNED, so the two can desync — and on 2026-08-05 they did. #164
      #    flipped `hydra-gates-require-full-coverage` to default TRUE, but
      #    the accounting that makes that flag survivable (NOT APPLICABLE, as
      #    distinct from a structural or a wiring gap) ships in the PACKAGE.
      #    So every pin older than `f7eaf2a` now fails the coverage assertion
      #    for gates it has no subject matter for. Measured diff-scoped,
      #    exactly as CI scopes it:
      #      v1.0.1  exit 98  FAIL — "GATES THAT DID NOT RUN: 24 33"
      #      v1.3.0  exit 0   PASS — those gates named NOT APPLICABLE
      #    The old pin was not merely stale, it was failing this repo's CI for
      #    a reason that had nothing to do with this repo — and it is what is
      #    currently blocking #807 and #805.
      #
      # v1.3.0 is `f7eaf2a` = .github@main, tagged so the ref stays
      # reproducible and a later gate change cannot move this repo's verdict
      # without a commit here.
      enable-hydra-gates: true
      hydra-gates-ref: v1.5.0
